services:
  host:
    image: dharmatlas:${IMAGE_TAG:-prod}
    user: app
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    environment:
      ASPNETCORE_URLS: http://+:8080
      DHARMATLAS_OTLP_ENDPOINT: ${DHARMATLAS_OTLP_ENDPOINT:-}
      DHARMATLAS_SENTRY_DSN: ${DHARMATLAS_SENTRY_DSN:-}
    env_file:
      - prod.env
    depends_on:
      postgres:
        condition: service_healthy
