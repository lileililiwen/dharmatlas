apiVersion: apps/v1
kind: Deployment
metadata:
  name: dharmatlas-host
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dharmatlas-host
  template:
    metadata:
      labels:
        app: dharmatlas-host
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
      containers:
        - name: host
          image: dharmatlas:prod
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 128Mi
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__Dharmatlas
              valueFrom:
                secretKeyRef:
                  name: dharmatlas-db
                  key: connection-string
            - name: DHARMATLAS_OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: dharmatlas-oidc
                  key: issuer
            - name: DHARMATLAS_OIDC_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: dharmatlas-oidc
                  key: audience
            - name: DHARMATLAS_OIDC_JWKS_URI
              valueFrom:
                secretKeyRef:
                  name: dharmatlas-oidc
                  key: jwks-uri
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 30
