schema: spec-driven

context: |
  Project: Dharmatlas, an open historical atlas of Buddhism.
  Planned stack: ASP.NET Core, PostgreSQL, React/Next.js, MapLibre, D3, Cytoscape.js.
  Product invariant: source-first, non-sectarian, uncertainty-aware historical data.
  MVP: 500 BCE–1000 CE; India, Central Asia, China, Sri Lanka, Tibet, Korea, Japan.
  Keep changes small and follow the one-change workflow in AGENTS.md.

